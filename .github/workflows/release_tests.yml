name: test release tool

on:
  push:
    paths:
      - .github/workflows/release_tests.yml
      - scripts/release.py
      - scripts/release_tests.py
  pull_request:
    paths:
      - .github/workflows/release_tests.yml
      - scripts/release.py
      - scripts/release_tests.py

permissions: {}

env:
  PIP_UPLOADED_PRIOR_TO: P2D

jobs:
  test-release-tool:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
        os: [macOS-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Give us all history, branches and tags
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          pip-version: "26.1"

      - name: Install dependencies
        run: python -m pip install --group coverage --group release

      - name: Print Python Version
        shell: bash
        run: python --version --version && which python

      - name: Print Pip Version
        shell: bash
        run: pip --version && which pip

      - name: Print Git Version
        shell: bash
        run: git --version && which git

      - name: Run unit tests via coverage + print report
        shell: bash
        run: |
          coverage run scripts/release_tests.py
          coverage report --show-missing
