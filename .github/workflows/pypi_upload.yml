name: build and publish

on:
  release:
    types: published
  pull_request:
  push:
    branches: main

permissions: {}

env:
  PIP_UPLOADED_PRIOR_TO: P2D
  PROJECT: https://pypi.org/p/black

jobs:
  configure:
    name: generate wheels matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.set-matrix.outputs.include }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          allow-prereleases: true

      - name: Install dependencies
        run: python -m pip install --group cibw

      - name: generate full matrix
        if: |
          github.event_name == 'release' || contains(github.event.pull_request.labels.*.name, 'ci: build all wheels')
        run: |
          {
            cibuildwheel --print-build-identifiers --platform linux --archs x86_64 \
              | jq -Rn '[{"only": inputs, "os": "ubuntu-latest"}]'
            cibuildwheel --print-build-identifiers --platform macos --archs x86_64,ARM64 \
              | jq -Rn '[{"only": inputs, "os": "macos-latest"}]'
            cibuildwheel --print-build-identifiers --platform windows --archs AMD64 \
              | jq -Rn '[{"only": inputs, "os": "windows-latest"}]'
            cibuildwheel --print-build-identifiers --platform windows --archs ARM64 \
              | jq -Rn '[{"only": inputs, "os": "windows-11-arm"}]'
          } | jq -cs 'add' > /tmp/matrix

      - name: generate partial matrix
        if: |
          github.event_name != 'release' && !contains(github.event.pull_request.labels.*.name, 'ci: build all wheels')
        run: |
          {
            CIBW_BUILD="cp311-*" cibuildwheel --print-build-identifiers --platform linux --archs x86_64 \
              | jq -Rn '[{"only": inputs, "os": "ubuntu-latest"}]'
            CIBW_BUILD="cp313-*" cibuildwheel --print-build-identifiers --platform macos --archs x86_64 \
              | jq -Rn '[{"only": inputs, "os": "macos-latest"}]'
            CIBW_BUILD="cp315-*" cibuildwheel --print-build-identifiers --platform windows --archs AMD64 \
              | jq -Rn '[{"only": inputs, "os": "windows-latest"}]'
          } | jq -cs 'add' > /tmp/matrix

      - id: set-matrix
        run: echo "include=$(cat /tmp/matrix)" | tee -a $GITHUB_OUTPUT

  mypyc:
    name: mypyc wheels ${{ matrix.only }}
    needs: configure
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include: ${{ fromJson(needs.configure.outputs.include) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          allow-prereleases: true

      - name: Install dependencies
        run: python -m pip install --group cibw

      - name: Run cibuildwheel
        run: cibuildwheel . --only ${{ matrix.only }}

      - name: Upload wheels as workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.only }}-mypyc-wheels
          path: wheelhouse/

  hatch:
    name: sdist + pure wheel
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          allow-prereleases: true

      - name: Install dependencies
        run: python -m pip install --group hatch

      - name: Calculate PIP_UPLOADED_PRIOR_TO
        # virtualenv 20.39 uses pip 26.0 - manually calculate this until we bump virtualenv/hatch
        id: uploaded_prior_to
        run:
          echo "date=$(date -u -d "2 days ago" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build wheel and source distributions
        run: python -m hatch build
        env:
          PIP_UPLOADED_PRIOR_TO: ${{ steps.uploaded_prior_to.outputs.date }}

      - name: Store the distribution packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist-and-pure-wheel
          path: dist/

  publish-mypyc:
    if: github.event_name == 'release'
    needs: mypyc
    runs-on: ubuntu-latest
    environment:
      name: release
      url: ${{ env.PROJECT }}
    permissions:
      id-token: write # Required for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-mypyc-wheels"
          path: wheelhouse/
          merge-multiple: true

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: wheelhouse/
          verbose: true

  publish-hatch:
    if: github.event_name == 'release'
    needs: hatch
    runs-on: ubuntu-latest
    environment:
      name: release
      url: ${{ env.PROJECT }}
    permissions:
      id-token: write # Required for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist-and-pure-wheel
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          verbose: true
